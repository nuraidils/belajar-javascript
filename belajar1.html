        // DOM

        document.getElementById("satu").innerHTML = "halo, saya diubah"

        document.getElementsByClassName("daftar")[2].innerHTML = "saya diubah"

        // DOM event listener click
        document.getElementById('tekan').addEventListener('click', function () {
            // kode yg dieksekusi ketika button diklik
            var nama = prompt("masukkan nama anda")
            alert("selamat datang " + nama)
        })

        // membuat function
        function matikan(opsi) {
            if (opsi == true) {
                document.getElementsByTagName("body")[0].style.backgroundColor = "black"
                // alternatif
                // document.body.style.backgroundColor = "black"
            } else {
                // document.getElementsByTagName("body")[0].style.backgroundColor = "black"
                // alternatif
                document.body.style.backgroundColor = "white"
            }
        }
